name: Build Installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
            artifact: 'src-tauri/target/release/bundle/nsis/*.exe*'
          - platform: macos-15
            bundles: dmg
            artifact: 'src-tauri/target/release/bundle/dmg/*.dmg*'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version parity
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          function Read-MatchedVersion {
            param(
              [Parameter(Mandatory)][string]$Path,
              [Parameter(Mandatory)][string]$Pattern
            )
            $match = [regex]::Match((Get-Content -Raw -LiteralPath $Path), $Pattern)
            if (-not $match.Success) { throw "Could not read a version from $Path." }
            $match.Groups[1].Value
          }

          $package = Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json
          $versions = [ordered]@{
            'package.json' = [string]$package.version
            'package-lock.json' = Read-MatchedVersion 'package-lock.json' '(?m)^\s{2}"version"\s*:\s*"([^"]+)"'
            'package-lock.json root package' = Read-MatchedVersion 'package-lock.json' '(?ms)^\s{4}""\s*:\s*\{\s*"name"\s*:\s*"praetorium",\s*"version"\s*:\s*"([^"]+)"'
            'src-tauri/Cargo.toml' = Read-MatchedVersion 'src-tauri/Cargo.toml' '(?m)^version\s*=\s*"([^"]+)"\s*$'
            'src-tauri/Cargo.lock' = Read-MatchedVersion 'src-tauri/Cargo.lock' '(?ms)^\[\[package\]\]\s*name\s*=\s*"praetorium"\s*version\s*=\s*"([^"]+)"'
            'src-tauri/tauri.conf.json' = [string](Get-Content -Raw -LiteralPath src-tauri/tauri.conf.json | ConvertFrom-Json).version
            'scripts/install-praetorium.ps1' = Read-MatchedVersion 'scripts/install-praetorium.ps1' '(?m)^\s*\[string\]\$Version\s*=\s*''v([^'']+)'''
          }

          $expected = [string]$package.version
          $mismatches = @($versions.GetEnumerator() | Where-Object { $_.Value -ne $expected })
          if (-not $expected -or $mismatches.Count -gt 0) {
            $detail = ($versions.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ', '
            throw "Praetorium version mismatch: $detail"
          }
          if ($env:RELEASE_REF_TYPE -eq 'tag' -and $env:RELEASE_REF_NAME -ne "v$expected") {
            throw "Release tag $($env:RELEASE_REF_NAME) does not match manifest version v$expected."
          }
          Write-Host "Praetorium version parity verified: v$expected"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Tauri app
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --verbose

      - name: Create Windows checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
            "$hash  $($_.Name)" | Set-Content -Encoding ascii -LiteralPath "$($_.FullName).sha256"
          }

      - name: Create macOS checksum
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for file in src-tauri/target/release/bundle/dmg/*.dmg; do
            shasum -a 256 "$file" > "$file.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: praetorium-${{ matrix.bundles }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          draft: false
          generate_release_notes: true
